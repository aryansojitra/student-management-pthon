{% extends 'base.html' %}
{% block content %}
<h2>Faculty Notice Management</h2>
<form method="post">
    {% csrf_token %}
    <label for="title">Title:</label>
    <input type="text" name="title" id="title" required><br>
    <label for="message">Message:</label><br>
    <textarea name="message" id="message" rows="4" cols="50" required></textarea><br>
    <label for="semester">Semester:</label>
    <input type="number" name="semester" id="semester" min="1" required><br>
    <button type="submit">Post Notice</button>
</form>
<h3>Notices</h3>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Message</th>
        <th>Semester</th>
        <th>Date</th>
    </tr>
    {% for notice in notices %}
    <tr>
        <td>{{ notice.title }}</td>
        <td>{{ notice.message }}</td>
        <td>{{ notice.semester }}</td>
        <td>{{ notice.date }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
